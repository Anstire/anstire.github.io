<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anstire | Systems & Code</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
    body { background: #050505; color: #fff; overflow-x: hidden; }
    
    /* Navigation */
    nav { position: fixed; top: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; z-index: 100; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,255,255,0.1); }
    .logo { font-size: 24px; font-weight: bold; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.5); letter-spacing: 2px; text-decoration: none; }
    .links a { color: #fff; text-decoration: none; margin-left: 30px; font-size: 14px; text-transform: uppercase; transition: 0.3s; }
    .links a:hover { color: #b478ff; text-shadow: 0 0 10px rgba(180,120,255,0.8); }

    /* Hero Section */
    .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 10; pointer-events: none; }
    h1 { font-size: 4rem; letter-spacing: 5px; margin-bottom: 10px; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
    p { font-size: 1.2rem; color: #aaa; letter-spacing: 2px; margin-bottom: 40px; text-transform: uppercase; }
    .cta { pointer-events: auto; padding: 15px 40px; background: transparent; border: 1px solid #00ffff; color: #00ffff; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.3s; text-decoration: none; }
    .cta:hover { background: #00ffff; color: #000; box-shadow: 0 0 20px #00ffff; }

    /* Canvas Background */
    #bg-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <nav>
    <a href="/" class="logo">ANSTIRE</a>
    <div class="links">
      <a href="/tools/">Tools</a>
      <a href="/source-code/">Arena</a>
      <a href="/about/">Terminal</a>
      <a href="/contact/">Comms</a>
    </div>
  </nav>

  <div class="hero">
    <h1>BUILDING SYSTEMS</h1>
    <p>Algorithms · Physics Simulations · Scalable Architecture</p>
    <a href="/tools/" class="cta">Enter The Lab</a>
  </div>

  <script>
    // Simplified Breathing Background for Hero
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();
    
    let time = 0;
    function draw() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
      ctx.fillRect(0, 0, W, H);
      time += 0.01;
      
      const cx = W/2, cy = H/2;
      for(let i = 0; i < 200; i++) {
        const angle = i * 0.1 + time;
        const r = i * 3;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        
        ctx.fillStyle = `hsla(${180 + Math.sin(i*0.05)*50}, 100%, 50%, 0.5)`;
        ctx.beginPath();
        ctx.arc(x, y, 2, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
