<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Animated Phyllotaxis Spiral</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000000;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });

  let w = 0, h = 0, dpr = 1;
  let cx = 0, cy = 0;

  const points = [];
  const maxPoints = 2200;

  const baseGoldenAngle = 137.5 * Math.PI / 180;
  const baseC = 4.2;
  const pointRadius = 2.2;

  let lastTime = 0;
  let spawnAccumulator = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.floor(window.innerWidth);
    h = Math.floor(window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = w * 0.5;
    cy = h * 0.5;
  }

  window.addEventListener("resize", resize, { passive: true });
  resize();

  function addPoint(n) {
    points.push({ n });
  }

  function step(time) {
    const t = time * 0.001;

    // Gentle breathing / kaleidoscope motion
    const cFluct = 1 + 0.12 * Math.sin(t * 0.9);
    const angleFluct = (Math.sin(t * 0.7) * 1.7 + Math.cos(t * 0.43) * 0.9) * Math.PI / 180;
    const goldenAngle = baseGoldenAngle + angleFluct;
    const c = baseC * cFluct;

    // Grow point-by-point
    const spawnRate = 42; // points per second
    if (points.length < maxPoints) {
      spawnAccumulator += (time - lastTime) * 0.001 * spawnRate;
      while (spawnAccumulator >= 1 && points.length < maxPoints) {
        addPoint(points.length + 1);
        spawnAccumulator -= 1;
      }
    }
    lastTime = time;

    // Clear background
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, w, h);

    // Draw points
    for (let i = 0; i < points.length; i++) {
      const n = points[i].n;

      const angle = n * goldenAngle;
      const radius = c * Math.sqrt(n) * 18;

      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;

      // Distance-based HSL gradient: neon purple -> blue -> cyan
      const dist = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
      const maxDist = Math.sqrt(cx * cx + cy * cy);
      const hue = 275 + (dist / maxDist) * 95 + Math.sin(t * 0.8 + n * 0.01) * 8;
      const sat = 100;
      const light = 58 + Math.sin(t * 1.4 + n * 0.015) * 8;

      ctx.beginPath();
      ctx.fillStyle = `hsl(${hue}, ${sat}%, ${light}%)`;
      ctx.arc(x, y, pointRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
})();
</script>
</body>
</html>
