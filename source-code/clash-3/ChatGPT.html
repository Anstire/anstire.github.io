<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Pi Constellation</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
      touch-action: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const TOTAL_DIGITS = 1000;
  const STEP = 10;
  const DURATION_MS = 10000; // exactly 10 seconds at normal speed

  let W = 0, H = 0, DPR = 1;
  let pi = "";
  let drawnCount = 0;
  let x = 0, y = 0;
  let startTime = 0;
  let finished = false;

  function generatePiDigits(count) {
    const boxes = Math.floor((count * 10) / 3) + 1;
    const a = new Array(boxes).fill(2);

    const digits = [];
    let nines = 0;
    let predigit = 0;

    for (let j = 0; j < count; j++) {
      let q = 0;

      for (let i = boxes; i > 0; i--) {
        const x = 10 * a[i - 1] + q * i;
        a[i - 1] = x % (2 * i - 1);
        q = Math.floor(x / (2 * i - 1));
      }

      a[0] = q % 10;
      q = Math.floor(q / 10);

      if (q === 9) {
        nines++;
      } else if (q === 10) {
        digits.push(predigit + 1);
        for (let k = 0; k < nines; k++) digits.push(0);
        predigit = 0;
        nines = 0;
      } else {
        digits.push(predigit);
        for (let k = 0; k < nines; k++) digits.push(9);
        predigit = q;
        nines = 0;
      }
    }

    digits.push(predigit);
    return digits.slice(1, count + 1).join("");
  }

  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    pi = generatePiDigits(TOTAL_DIGITS);

    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    drawnCount = 0;
    x = W / 2;
    y = H / 2;
    startTime = performance.now();
    finished = false;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.shadowColor = "rgba(120,255,255,0.5)";
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.arc(x, y, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function strokeSegment(x1, y1, x2, y2, hue) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = `hsla(${hue}, 100%, 62%, 0.16)`;
    ctx.shadowColor = `hsla(${hue}, 100%, 65%, 0.65)`;
    ctx.shadowBlur = 18;
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.strokeStyle = `hsla(${hue}, 100%, 76%, 0.95)`;
    ctx.shadowBlur = 0;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    ctx.restore();
  }

  function drawWrappedSegment(x1, y1, x2, y2, hue, depth = 0) {
    if (depth > 8) {
      strokeSegment(x1, y1, x2, y2, hue);
      return;
    }

    const dx = x2 - x1;
    const dy = y2 - y1;
    const hits = [];

    if (x2 < 0 && dx !== 0) hits.push({ t: (0 - x1) / dx, edge: "left" });
    if (x2 > W && dx !== 0) hits.push({ t: (W - x1) / dx, edge: "right" });
    if (y2 < 0 && dy !== 0) hits.push({ t: (0 - y1) / dy, edge: "top" });
    if (y2 > H && dy !== 0) hits.push({ t: (H - y1) / dy, edge: "bottom" });

    const valid = hits.filter(h => h.t > 0 && h.t < 1).sort((a, b) => a.t - b.t);

    if (!valid.length) {
      strokeSegment(x1, y1, x2, y2, hue);
      return;
    }

    const hit = valid[0];
    const ix = x1 + dx * hit.t;
    const iy = y1 + dy * hit.t;

    strokeSegment(x1, y1, ix, iy, hue);

    if (hit.edge === "left") {
      drawWrappedSegment(W, iy, x2 + W, y2, hue, depth + 1);
    } else if (hit.edge === "right") {
      drawWrappedSegment(0, iy, x2 - W, y2, hue, depth + 1);
    } else if (hit.edge === "top") {
      drawWrappedSegment(ix, H, x2, y2 + H, hue, depth + 1);
    } else if (hit.edge === "bottom") {
      drawWrappedSegment(ix, 0, x2, y2 - H, hue, depth + 1);
    }
  }

  function stepOnce() {
    if (drawnCount >= TOTAL_DIGITS) {
      finished = true;
      return;
    }

    const digit = pi.charCodeAt(drawnCount) - 48;
    const angle = digit * Math.PI * 2 / 10;
    const nx = x + Math.cos(angle) * STEP;
    const ny = y + Math.sin(angle) * STEP;

    const progress = drawnCount / TOTAL_DIGITS;
    const hue = 188 + progress * 98;

    drawWrappedSegment(x, y, nx, ny, hue);

    x = ((nx % W) + W) % W;
    y = ((ny % H) + H) % H;
    drawnCount++;
  }

  function animate(now) {
    const elapsed = now - startTime;
    const targetCount = Math.min(TOTAL_DIGITS, Math.floor((elapsed / DURATION_MS) * TOTAL_DIGITS));

    while (drawnCount < targetCount) {
      stepOnce();
    }

    if (elapsed >= DURATION_MS && !finished) {
      while (drawnCount < TOTAL_DIGITS) stepOnce();
      finished = true;
      return;
    }

    if (!finished) requestAnimationFrame(animate);
  }

  window.addEventListener("resize", resize, { passive: true });
  resize();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
