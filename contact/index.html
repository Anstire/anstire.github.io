<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anstire | Comms</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
    body { background: #050505; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    
    nav { padding: 20px 50px; display: flex; justify-content: space-between; border-bottom: 1px solid rgba(0,255,255,0.1); }
    .logo { font-weight: bold; color: #00ffff; text-decoration: none; }
    .links a { color: #fff; text-decoration: none; margin-left: 30px; text-transform: uppercase; font-size: 14px; }

    .form-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    form { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); padding: 40px; border: 1px solid #333; border-radius: 8px; width: 100%; max-width: 500px; }
    
    h2 { color: #b478ff; margin-bottom: 25px; letter-spacing: 2px; }
    input, textarea { width: 100%; background: #000; border: 1px solid #444; color: #00ffff; padding: 15px; margin-bottom: 20px; font-size: 14px; border-radius: 4px; outline: none; }
    input:focus, textarea:focus { border-color: #00ffff; box-shadow: 0 0 10px rgba(0,255,255,0.2); }
    
    button { width: 100%; padding: 15px; background: transparent; border: 1px solid #00ffff; color: #00ffff; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
    button:hover { background: #00ffff; color: #000; box-shadow: 0 0 15px #00ffff; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">ANSTIRE</a>
    <div class="links">
      <a href="/tools/">Tools</a>
      <a href="/contact/">Comms</a>
    </div>
  </nav>

  <div class="form-wrapper">
    <form onsubmit="event.preventDefault(); alert('Link to Formspree or custom backend API here.');">
      <h2>SECURE COMMS</h2>
      <input type="text" placeholder="Designation / Name" required>
      <input type="email" placeholder="Return Address" required>
      <textarea rows="5" placeholder="Transmit Message..." required></textarea>
      <button type="submit">Establish Connection</button>
    </form>
  </div>

</body>
</html>
