<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anstire | Terminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
    body { background: #050505; color: #00ff00; min-height: 100vh; display: flex; flex-direction: column; }
    
    nav { width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
    .logo, .links a { color: #555; text-decoration: none; text-transform: uppercase; font-size: 14px; }
    .logo { font-weight: bold; color: #fff; }
    .links a { margin-left: 30px; }

    .terminal { flex-grow: 1; padding: 50px; max-width: 900px; margin: 0 auto; width: 100%; }
    .prompt::before { content: "root@anstire:~$ "; color: #00ffff; }
    .text-line { margin-bottom: 15px; line-height: 1.6; min-height: 22px; }
    .cursor { display: inline-block; width: 10px; height: 18px; background: #00ff00; animation: blink 1s step-end infinite; vertical-align: middle; }
    
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="logo">ANSTIRE</a>
    <div class="links">
      <a href="/tools/">Tools</a>
      <a href="/about/">Terminal</a>
    </div>
  </nav>

  <div class="terminal" id="term">
    <!-- Text injected via JS -->
  </div>

  <script>
    const lines = [
      "Initializing profile data...",
      "Location: Patna, Bihar.",
      "Status: Entrepreneur in training. Mastering the foundational mechanics of Science and Mathematics.",
      "Current Focus: Local LLM deployment (GGUF via LM Studio), custom software architecture, and algorithm analysis.",
      "Objective: Scalable tech solutions and securing Google Play Developer deployment.",
      "Execute file: /sys/vision/code_clash.sh"
    ];

    const term = document.getElementById('term');
    let lineIdx = 0;
    let charIdx = 0;

    function typeLine() {
      if (lineIdx >= lines.length) return;
      
      let currentLineDiv = document.getElementById('line-' + lineIdx);
      if (!currentLineDiv) {
        currentLineDiv = document.createElement('div');
        currentLineDiv.id = 'line-' + lineIdx;
        currentLineDiv.className = 'text-line prompt';
        currentLineDiv.innerHTML = '<span class="content"></span><span class="cursor"></span>';
        term.appendChild(currentLineDiv);
      }

      const contentSpan = currentLineDiv.querySelector('.content');
      contentSpan.textContent += lines[lineIdx][charIdx];
      charIdx++;

      if (charIdx < lines[lineIdx].length) {
        setTimeout(typeLine, Math.random() * 30 + 20); // Typing speed
      } else {
        currentLineDiv.querySelector('.cursor').remove();
        lineIdx++;
        charIdx = 0;
        setTimeout(typeLine, 400); // Pause between lines
      }
    }
    
    setTimeout(typeLine, 500);
  </script>
</body>
</html>
