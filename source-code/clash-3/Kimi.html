<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi Constellation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; }
  #viewport {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
  }
  #pathCanvas {
    position: absolute;
    image-rendering: auto;
  }
  #headCanvas {
    position: absolute;
    pointer-events: none;
  }
  #info {
    position: fixed;
    top: 14px; left: 14px;
    color: rgba(180, 220, 255, 0.85);
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    pointer-events: none;
    text-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
    z-index: 10;
  }
  #info span { color: #00ffff; font-weight: bold; }
</style>
</head>
<body>
<div id="viewport">
  <canvas id="pathCanvas"></canvas>
  <canvas id="headCanvas"></canvas>
</div>
<div id="info">PI CONSTELLATION | Digits: <span id="count">0</span>/1000 | Auto-Camera Active</div>

<script>
const pathCanvas = document.getElementById('pathCanvas');
const pathCtx = pathCanvas.getContext('2d', { alpha: false });
const headCanvas = document.getElementById('headCanvas');
const headCtx = headCanvas.getContext('2d');
const viewport = document.getElementById('viewport');
const countEl = document.getElementById('count');

const DURATION = 10000; // exactly 10 seconds

/* -----------------------------------------------------------
   First 1,000 digits of Pi after the decimal point
   ----------------------------------------------------------- */
const piDigits = 
  "14159265358979323846264338327950288419716939937510" +
  "58209749445923078164062862089986280348253421170679" +
  "82148086513282306647093844609550582231725359408128" +
  "48111745028410270193852110555964462294895493038196" +
  "44288109756659334461284756482337867831652712019091" +
  "45648566923460348610454326648213393607260249141273" +
  "72458700660631558817488152092096282925409171536436" +
  "78925903600113305305488204665213841469519415116094" +
  "33057270365759591953092186117381932611793105118548" +
  "07446237996274956735188575272489122793818301194912" +
  "98336733624406566430860213949463952247371907021798" +
  "60943702770539217176293176752384674818467669405132" +
  "00056812714526356082778577134275778960917363717872" +
  "14684409012249534301465495853710507922796892589235" +
  "42019956112129021960864034418159813629774771309960" +
  "51870721134999999837297804995105973173281609631859" +
  "50244594553469083026425223082533446850352619311881" +
  "71010003137838752886587533208381420617177669147303" +
  "59825349042875546873115956286388235378759375195778" +
  "18577805321712268066130019278766111959092164201989";

const TOTAL = piDigits.length;
const SEGMENT_LENGTH = 10;

/* -----------------------------------------------------------
   Pre-compute all segment data
   ----------------------------------------------------------- */
const segments = [];
let x = 0, y = 0;
let minX = 0, maxX = 0, minY = 0, maxY = 0;

for (let i = 0; i < TOTAL; i++) {
  const digit = piDigits.charCodeAt(i) - 48;
  const angle = digit * 36 * Math.PI / 180;
  const nx = x + Math.cos(angle) * SEGMENT_LENGTH;
  const ny = y + Math.sin(angle) * SEGMENT_LENGTH;
  const progress = i / (TOTAL - 1);
  const hue = 180 + progress * 100;
  
  segments.push({ x1: x, y1: y, x2: nx, y2: ny, hue });
  
  if (nx < minX) minX = nx; if (nx > maxX) maxX = nx;
  if (ny < minY) minY = ny; if (ny > maxY) maxY = ny;
  
  x = nx; y = ny;
}

/* -----------------------------------------------------------
   Camera setup (pre-computed, CSS-transformed)
   ----------------------------------------------------------- */
const pad = 100;
const bboxW = maxX - minX;
const bboxH = maxY - minY;
const scale = Math.min(
  (window.innerWidth  - pad * 2) / Math.max(bboxW, 1),
  (window.innerHeight - pad * 2) / Math.max(bboxH, 1),
  1
);
const cx = (minX + maxX) / 2;
const cy = (minY + maxY) / 2;

const glowPad = 40;
const canvasW = Math.ceil(bboxW + glowPad * 2);
const canvasH = Math.ceil(bboxH + glowPad * 2);
const offsetX = -minX + glowPad;
const offsetY = -minY + glowPad;

pathCanvas.width = canvasW;
pathCanvas.height = canvasH;
headCanvas.width = canvasW;
headCanvas.height = canvasH;

const tx = window.innerWidth / 2 - cx * scale;
const ty = window.innerHeight / 2 - cy * scale;
viewport.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
pathCanvas.style.transform = `translate(${-offsetX}px, ${-offsetY}px)`;
headCanvas.style.transform = `translate(${-offsetX}px, ${-offsetY}px)`;

/* -----------------------------------------------------------
   Starfield background
   ----------------------------------------------------------- */
const starCanvas = document.createElement('canvas');
starCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;';
document.body.appendChild(starCanvas);
const starCtx = starCanvas.getContext('2d');

function drawStars() {
  starCanvas.width = window.innerWidth;
  starCanvas.height = window.innerHeight;
  starCtx.fillStyle = '#000';
  starCtx.fillRect(0, 0, starCanvas.width, starCanvas.height);
  for (let i = 0; i < 300; i++) {
    starCtx.fillStyle = `rgba(255,255,255,${Math.random() * 0.5 + 0.1})`;
    starCtx.beginPath();
    starCtx.arc(Math.random() * starCanvas.width, Math.random() * starCanvas.height, Math.random() * 1.2, 0, Math.PI * 2);
    starCtx.fill();
  }
}
drawStars();

/* -----------------------------------------------------------
   Render helpers
   ----------------------------------------------------------- */
function drawSegment(i) {
  const s = segments[i];
  const color = `hsl(${s.hue}, 100%, 65%)`;
  
  pathCtx.shadowBlur = 14;
  pathCtx.shadowColor = color;
  pathCtx.strokeStyle = color;
  pathCtx.lineWidth = 2.2;
  pathCtx.lineCap = 'round';
  pathCtx.lineJoin = 'round';
  
  pathCtx.beginPath();
  pathCtx.moveTo(s.x1 + offsetX, s.y1 + offsetY);
  pathCtx.lineTo(s.x2 + offsetX, s.y2 + offsetY);
  pathCtx.stroke();
}

function drawHead(x, y, hue) {
  headCtx.clearRect(0, 0, canvasW, canvasH);
  const color = `hsl(${hue}, 100%, 65%)`;
  
  headCtx.shadowBlur = 30;
  headCtx.shadowColor = color;
  headCtx.fillStyle = '#fff';
  headCtx.beginPath();
  headCtx.arc(x + offsetX, y + offsetY, 3.5, 0, Math.PI * 2);
  headCtx.fill();
}

/* -----------------------------------------------------------
   Time-based animation: exactly 10 seconds
   ----------------------------------------------------------- */
let drawn = 0;
let startTime = 0;
let finished = false;

function animate(now) {
  if (!startTime) startTime = now;
  
  if (!finished) {
    // How many segments should be drawn by this moment in time?
    const elapsed = now - startTime;
    const target = Math.min(TOTAL, Math.floor(elapsed / DURATION * TOTAL));
    
    if (target > drawn) {
      // Batch draw all newly due segments
      for (let i = drawn; i < target; i++) {
        drawSegment(i);
      }
      
      const last = segments[target - 1];
      drawHead(last.x2, last.y2, last.hue);
      drawn = target;
      
      if (drawn % 3 === 0 || drawn === TOTAL) {
        countEl.textContent = drawn;
      }
      
      if (drawn >= TOTAL) {
        finished = true;
      }
    }
  } else {
    // Completion pulse
    const pulse = Math.sin(now * 0.003) * 0.3 + 1.2;
    const last = segments[TOTAL - 1];
    const color = `hsl(${last.hue}, 100%, 65%)`;
    
    headCtx.clearRect(0, 0, canvasW, canvasH);
    headCtx.shadowBlur = 35 * pulse;
    headCtx.shadowColor = color;
    headCtx.fillStyle = '#fff';
    headCtx.beginPath();
    headCtx.arc(last.x2 + offsetX, last.y2 + offsetY, 3.5 * pulse, 0, Math.PI * 2);
    headCtx.fill();
  }
  
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
</html>
