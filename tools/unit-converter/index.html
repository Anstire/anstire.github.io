<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter — Anstire Tools</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <style>
    .tool-layout { max-width: 720px; margin: 0 auto; padding: calc(var(--nav-height) + 64px) 24px 88px; }
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-tertiary); margin-bottom: 32px; }
    .breadcrumb a { color: var(--accent); }

    /* Category tabs */
    .cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
    .cat-tab { padding: 8px 18px; border-radius: 30px; font-size: 13px; font-weight: 500; border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--text-secondary); cursor: pointer; transition: var(--transition); }
    .cat-tab:hover { color: var(--text-primary); }
    .cat-tab.active { background: rgba(var(--accent-rgb), 0.12); color: var(--accent); border-color: rgba(var(--accent-rgb), 0.35); }

    .conv-card { padding: 40px; }

    .conv-row { display: grid; grid-template-columns: 1fr 56px 1fr; gap: 12px; align-items: end; margin-bottom: 24px; }
    @media (max-width: 520px) { .conv-row { grid-template-columns: 1fr; } }

    .swap-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(var(--accent-rgb), 0.1); border: 1px solid rgba(var(--accent-rgb), 0.25); display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: var(--transition); margin-bottom: 2px; }
    .swap-btn:hover { background: rgba(var(--accent-rgb), 0.2); transform: rotate(180deg); }
    @media (max-width: 520px) { .swap-btn { width: 36px; height: 36px; } }

    .result-display { background: var(--bg-elevated); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 16px 18px; font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.02em; min-height: 64px; display: flex; align-items: center; }
    .result-display.has-value { background: linear-gradient(135deg, rgba(var(--accent-rgb),0.06), rgba(var(--accent-2-rgb),0.04)); border-color: rgba(var(--accent-rgb),0.2); color: var(--accent); }

    .formula-note { font-size: 12.5px; color: var(--text-tertiary); text-align: center; padding: 10px; background: var(--bg-elevated); border-radius: var(--radius-sm); border: 1px solid var(--glass-border); }

    /* Quick conversions table */
    .quick-table { margin-top: 28px; }
    .quick-table h3 { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; color: var(--text-primary); margin-bottom: 14px; }
    .qt-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--glass-border); font-size: 13.5px; }
    .qt-row:last-child { border-bottom: none; }
    .qt-from { color: var(--text-secondary); }
    .qt-to { font-weight: 600; color: var(--text-primary); }
  </style>
</head>
<body>
  <header id="site-nav"></header>
  <main class="page-wrapper">
    <div class="tool-layout">
      <div class="breadcrumb anim d1"><a href="/tools">Tools</a> <span>/</span> <span>Unit Converter</span></div>
      <h1 class="heading-1 anim d2" style="margin-bottom: 8px;">Unit <span class="gradient-text">Converter</span></h1>
      <p class="anim d3" style="color: var(--text-secondary); font-size: 15px; margin-bottom: 32px;">Real-time conversion across all major unit categories.</p>

      <!-- Category tabs -->
      <div class="cat-tabs anim d4">
        <button class="cat-tab active" onclick="setCategory('length', this)">📏 Length</button>
        <button class="cat-tab" onclick="setCategory('weight', this)">⚖️ Weight</button>
        <button class="cat-tab" onclick="setCategory('temperature', this)">🌡️ Temp</button>
        <button class="cat-tab" onclick="setCategory('area', this)">⬛ Area</button>
        <button class="cat-tab" onclick="setCategory('data', this)">💾 Data</button>
        <button class="cat-tab" onclick="setCategory('speed', this)">💨 Speed</button>
      </div>

      <div class="glass-card conv-card anim d5">
        <div class="conv-row">
          <div>
            <div class="form-group" style="margin-bottom: 10px;">
              <label>From</label>
              <select id="fromUnit" class="input" onchange="convert()"></select>
            </div>
            <input type="number" id="fromVal" class="input" placeholder="Enter value" oninput="convert()" value="1">
          </div>
          <div style="display: flex; justify-content: center;">
            <button class="swap-btn" onclick="swap()" title="Swap units">⇄</button>
          </div>
          <div>
            <div class="form-group" style="margin-bottom: 10px;">
              <label>To</label>
              <select id="toUnit" class="input" onchange="convert()"></select>
            </div>
            <div class="result-display" id="result">—</div>
          </div>
        </div>

        <div class="formula-note" id="formulaNote">Select a value to see the conversion</div>

        <div class="quick-table" id="quickTable">
          <h3>Quick Reference</h3>
          <div id="qtRows"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/assets/js/global.js"></script>
  <script>
    const CATS = {
      length: {
        units: ['Millimeter (mm)', 'Centimeter (cm)', 'Meter (m)', 'Kilometer (km)', 'Inch (in)', 'Foot (ft)', 'Yard (yd)', 'Mile (mi)'],
        keys: ['mm', 'cm', 'm', 'km', 'in', 'ft', 'yd', 'mi'],
        toBase: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
        quick: [['1 ft', '30.48 cm'], ['1 mi', '1.609 km'], ['1 in', '2.54 cm'], ['1 m', '3.281 ft']],
      },
      weight: {
        units: ['Milligram (mg)', 'Gram (g)', 'Kilogram (kg)', 'Metric Ton (t)', 'Ounce (oz)', 'Pound (lb)', 'Stone (st)'],
        keys: ['mg', 'g', 'kg', 't', 'oz', 'lb', 'st'],
        toBase: { mg: 0.000001, g: 0.001, kg: 1, t: 1000, oz: 0.028349523, lb: 0.45359237, st: 6.35029 },
        quick: [['1 lb', '453.6 g'], ['1 kg', '2.205 lb'], ['1 oz', '28.35 g'], ['1 st', '6.35 kg']],
      },
      temperature: {
        units: ['Celsius (°C)', 'Fahrenheit (°F)', 'Kelvin (K)'],
        keys: ['c', 'f', 'k'],
        toBase: null, // handled specially
        quick: [['0°C', '32°F'], ['100°C', '212°F'], ['37°C', '98.6°F'], ['−40°C', '−40°F']],
      },
      area: {
        units: ['Square mm (mm²)', 'Square cm (cm²)', 'Square m (m²)', 'Hectare (ha)', 'Square km (km²)', 'Square ft (ft²)', 'Acre (ac)', 'Square mi (mi²)'],
        keys: ['mm2', 'cm2', 'm2', 'ha', 'km2', 'ft2', 'ac', 'mi2'],
        toBase: { mm2: 0.000001, cm2: 0.0001, m2: 1, ha: 10000, km2: 1e6, ft2: 0.092903, ac: 4046.856, mi2: 2589988 },
        quick: [['1 ac', '4047 m²'], ['1 ha', '2.471 ac'], ['1 mi²', '2.59 km²'], ['1 ft²', '929 cm²']],
      },
      data: {
        units: ['Bit (b)', 'Byte (B)', 'Kilobyte (KB)', 'Megabyte (MB)', 'Gigabyte (GB)', 'Terabyte (TB)', 'Petabyte (PB)'],
        keys: ['b', 'B', 'KB', 'MB', 'GB', 'TB', 'PB'],
        toBase: { b: 0.125, B: 1, KB: 1024, MB: 1048576, GB: 1073741824, TB: 1.0995e12, PB: 1.1259e15 },
        quick: [['1 GB', '1024 MB'], ['1 TB', '1024 GB'], ['1 MB', '1048576 B'], ['1 KB', '1024 B']],
      },
      speed: {
        units: ['m/s', 'km/h', 'mph', 'Knot (kn)', 'ft/s'],
        keys: ['ms', 'kmh', 'mph', 'kn', 'fts'],
        toBase: { ms: 1, kmh: 0.277778, mph: 0.44704, kn: 0.514444, fts: 0.3048 },
        quick: [['1 mph', '1.609 km/h'], ['1 m/s', '3.6 km/h'], ['1 kn', '1.852 km/h'], ['100 km/h', '62.14 mph']],
      },
    };

    let curCat = 'length';

    function setCategory(cat, btn) {
      curCat = cat;
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const data = CATS[cat];
      const fu = document.getElementById('fromUnit'), tu = document.getElementById('toUnit');
      fu.innerHTML = data.units.map((u, i) => `<option value="${data.keys[i]}">${u}</option>`).join('');
      tu.innerHTML = data.units.map((u, i) => `<option value="${data.keys[i]}">${u}</option>`).join('');
      tu.selectedIndex = Math.min(1, data.units.length - 1);
      renderQuick(cat);
      convert();
    }

    function renderQuick(cat) {
      const rows = CATS[cat].quick;
      document.getElementById('qtRows').innerHTML = rows.map(([f, t]) => `<div class="qt-row"><span class="qt-from">${f}</span><span class="qt-to">= ${t}</span></div>`).join('');
    }

    function convert() {
      const v = parseFloat(document.getElementById('fromVal').value);
      const fk = document.getElementById('fromUnit').value;
      const tk = document.getElementById('toUnit').value;
      const res = document.getElementById('result');
      const fn = document.getElementById('formulaNote');

      if (isNaN(v)) { res.textContent = '—'; res.classList.remove('has-value'); fn.textContent = 'Enter a numeric value'; return; }

      let result;
      if (curCat === 'temperature') {
        if (fk === 'c' && tk === 'f') result = v * 9/5 + 32;
        else if (fk === 'c' && tk === 'k') result = v + 273.15;
        else if (fk === 'f' && tk === 'c') result = (v - 32) * 5/9;
        else if (fk === 'f' && tk === 'k') result = (v - 32) * 5/9 + 273.15;
        else if (fk === 'k' && tk === 'c') result = v - 273.15;
        else if (fk === 'k' && tk === 'f') result = (v - 273.15) * 9/5 + 32;
        else result = v;
      } else {
        const tb = CATS[curCat].toBase;
        result = (v * tb[fk]) / tb[tk];
      }

      const disp = Math.abs(result) >= 0.001 && Math.abs(result) < 1e9
        ? parseFloat(result.toPrecision(7)).toLocaleString()
        : result.toExponential(4);
      res.textContent = disp;
      res.classList.add('has-value');
      const fu = document.getElementById('fromUnit');
      const tu = document.getElementById('toUnit');
      fn.textContent = `${v} ${fu.options[fu.selectedIndex].text.split(' (')[0]} = ${disp} ${tu.options[tu.selectedIndex].text.split(' (')[0]}`;
    }

    function swap() {
      const fu = document.getElementById('fromUnit'), tu = document.getElementById('toUnit');
      [fu.value, tu.value] = [tu.value, fu.value];
      convert();
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => setTimeout(() => setCategory('length', document.querySelector('.cat-tab')), 100));
  </script>
</body>
</html>
