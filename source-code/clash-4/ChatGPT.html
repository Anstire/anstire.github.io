<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harmonic Spring Wave Loop</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });

  const LOOP_SECONDS = 10;
  const FPS = 60;
  const LOOP_FRAMES = LOOP_SECONDS * FPS;

  const NUM = 18;
  const masses = [];
  for (let i = 0; i < NUM; i++) masses.push({ i });

  let W = 0, H = 0, DPR = 1;
  let frame = 0;

  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  window.addEventListener('resize', resize, { passive: true });
  resize();

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function ease(t) {
    t = clamp01(t);
    return t * t * (3 - 2 * t);
  }

  function drawSpring(x1, y1, x2, y2, coils, amp) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len;
    const uy = dy / len;
    const px = -uy;
    const py = ux;

    ctx.beginPath();
    ctx.moveTo(x1, y1);

    const segs = coils * 2;
    for (let s = 1; s < segs; s++) {
      const t = s / segs;
      const wave = Math.sin(t * Math.PI * coils * 2);
      const bend = amp * wave;
      const x = x1 + dx * t + px * bend;
      const y = y1 + dy * t + py * bend;
      ctx.lineTo(x, y);
    }

    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function render() {
    const p = (frame % LOOP_FRAMES) / LOOP_FRAMES;   // 0..1
    const tau = Math.PI * 2;
    const t = p * tau;

    // Zero at the endpoints, strong in the middle, smooth for seamless looping.
    const chaos = Math.pow(Math.sin(Math.PI * p), 4);

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Subtle vignette
    const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.08, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(12,18,30,0.12)');
    vg.addColorStop(1, 'rgba(0,0,0,0.95)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    const cx = W * 0.5;
    const topY = H * 0.16;
    const midY = H * 0.52;
    const spacing = Math.min(76, W / (NUM + 1));
    const baseSpan = spacing * (NUM - 1);
    const startX = cx - baseSpan * 0.5;

    // Shared motion at the beginning and end: all masses move in sync.
    const syncY = Math.sin(t * 2) * Math.min(42, H * 0.055);
    const syncY2 = Math.sin(t * 4 + 0.65) * Math.min(12, H * 0.018);

    // Ambient glow line across the whole scene
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(90,140,255,0.10)';
    ctx.beginPath();
    ctx.moveTo(startX - spacing * 0.8, midY);
    ctx.lineTo(startX + baseSpan + spacing * 0.8, midY);
    ctx.stroke();

    for (const m of masses) {
      const i = m.i;
      const x = startX + i * spacing;
      const local = NUM === 1 ? 0.5 : i / (NUM - 1);

      // Chaos begins gently, becomes rich in the middle, then collapses cleanly back to sync.
      const waveA = Math.sin(t * 7  + i * 0.55);
      const waveB = Math.sin(t * 11 - i * 0.85 + 1.2);
      const waveC = Math.sin(t * 17 + i * 1.35 + Math.sin(t * 3 + local * 5));
      const spatial = Math.sin(local * Math.PI * 3.0 + t * 2.0);

      const chaosY =
        chaos * (
          waveA * 30 +
          waveB * 18 +
          waveC * 12 +
          spatial * 16
        );

      const y = midY + syncY + syncY2 + chaosY;

      // Spring anchor
      const anchorX = x;
      const anchorY = topY;

      // Spring
      const springHue = 200 + local * 120 + Math.sin(t * 2 + local * 8) * 10;
      ctx.strokeStyle = `hsla(${springHue}, 100%, 68%, ${0.35 + chaos * 0.35})`;
      ctx.lineWidth = 1.6;
      ctx.shadowColor = `hsla(${springHue}, 100%, 70%, ${0.55})`;
      ctx.shadowBlur = 10 + chaos * 14;
      drawSpring(anchorX, anchorY, x, y - 18, 10, 7 + chaos * 8);

      // String/rod above spring
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(180,210,255,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(anchorX, 20);
      ctx.lineTo(anchorX, anchorY - 8);
      ctx.stroke();

      // Top mount
      ctx.fillStyle = 'rgba(220,235,255,0.88)';
      ctx.beginPath();
      ctx.arc(anchorX, anchorY, 3.2, 0, tau);
      ctx.fill();

      // Mass glow
      const radius = 10 + chaos * 1.6;
      const massGrad = ctx.createRadialGradient(x - 4, y - 6, 2, x, y, 20);
      massGrad.addColorStop(0, 'rgba(255,255,255,0.98)');
      massGrad.addColorStop(0.35, `hsla(${springHue}, 100%, 78%, 0.95)`);
      massGrad.addColorStop(1, `hsla(${springHue}, 100%, 60%, 0.08)`);

      ctx.fillStyle = massGrad;
      ctx.shadowColor = `hsla(${springHue}, 100%, 70%, ${0.9})`;
      ctx.shadowBlur = 18 + chaos * 18;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, tau);
      ctx.fill();

      // Core mass
      ctx.shadowBlur = 0;
      ctx.fillStyle = `hsla(${springHue}, 100%, 86%, 0.95)`;
      ctx.beginPath();
      ctx.arc(x, y, radius * 0.46, 0, tau);
      ctx.fill();

      // Tiny highlight
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(x - 3.2, y - 3.8, 1.3, 0, tau);
      ctx.fill();
    }

    // Title text
    ctx.save();
    ctx.fillStyle = 'rgba(235,245,255,0.80)';
    ctx.font = '600 16px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Harmonic Spring Wave — seamless 10s loop', W * 0.5, H - 28);
    ctx.restore();
  }

  function tick() {
    render();
    frame++;
    requestAnimationFrame(tick);
  }

  tick();
})();
</script>
</body>
</html>
