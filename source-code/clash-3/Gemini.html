<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Pi Constellation</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="piCanvas"></canvas>

    <script>
        const canvas = document.getElementById('piCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimization: no alpha channel
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Set offscreen canvas large enough to hold the path
            offCanvas.width = 4000; 
            offCanvas.height = 4000;
        }
        window.addEventListener('resize', resize);
        resize();

        const piDigits = "31415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";

        const points = [];
        let cx = 2000, cy = 2000; // Center of offscreen canvas
        points.push({x: cx, y: cy});

        for (let i = 0; i < piDigits.length; i++) {
            let angle = (parseInt(piDigits[i]) * 36) * (Math.PI / 180);
            cx += Math.cos(angle) * 10;
            cy += Math.sin(angle) * 10;
            points.push({x: cx, y: cy});
        }

        let lastIndex = 0;
        let camX = width / 2, camY = height / 2;
        let startTime = null;
        const duration = 10000;

        function animate(t) {
            if (!startTime) startTime = t;
            let progress = Math.min((t - startTime) / duration, 1);
            let currentIndex = Math.floor(progress * (points.length - 1));

            // Only draw new segments to the offscreen canvas (incremental rendering)
            if (currentIndex > lastIndex) {
                offCtx.lineCap = 'round';
                offCtx.lineWidth = 2;
                for (let i = lastIndex + 1; i <= currentIndex; i++) {
                    let p1 = points[i-1], p2 = points[i];
                    let hue = 180 + (i / points.length * 90);
                    
                    offCtx.beginPath();
                    offCtx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
                    offCtx.shadowBlur = 6;
                    offCtx.shadowColor = `hsl(${hue}, 100%, 50%)`;
                    offCtx.moveTo(p1.x, p1.y);
                    offCtx.lineTo(p2.x, p2.y);
                    offCtx.stroke();
                }
                lastIndex = currentIndex;
            }

            // Calculate bounding box for the camera
            let minX = 2000, maxX = 2000, minY = 2000, maxY = 2000;
            for(let i=0; i<=currentIndex; i++) {
                minX = Math.min(minX, points[i].x); maxX = Math.max(maxX, points[i].x);
                minY = Math.min(minY, points[i].y); maxY = Math.max(maxY, points[i].y);
            }

            // Center camera
            let targetX = (width/2) - (minX + maxX)/2;
            let targetY = (height/2) - (minY + maxY)/2;
            camX += (targetX - camX) * 0.1;
            camY += (targetY - camY) * 0.1;

            // Main draw: High performance image blit
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, width, height);
            
            ctx.save();
            ctx.translate(camX, camY);
            ctx.drawImage(offCanvas, 0, 0); // This is much faster than 1000 lineTo calls
            
            // Draw head star
            let head = points[currentIndex];
            ctx.beginPath();
            ctx.arc(head.x, head.y, 3, 0, 7);
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
